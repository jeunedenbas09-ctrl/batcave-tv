name: Mise à jour Batcave
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python maj.py
      - name: Publier les fichiers
        run: |
          git config user.name "batcave-bot"
          git config user.email "bot@users.noreply.github.com"
          git add donnees.json briefing.mp3
          git commit -m "maj Batcave" || echo "rien à publier"
          git push
